name: Ingest dining menus

# Each run ingests today and tomorrow in every school's own time zone, so four
# runs a day keep menus fresh from Hawaii to Maine.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      school:
        description: "School slug, or all"
        default: "all"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CollegeMacro-backend

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CollegeMacro-backend/package-lock.json

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Ingest menus
        run: node src/cli/ingest.js --school=${{ inputs.school || 'all' }} --persist=true
